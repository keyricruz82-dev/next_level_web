<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | Next Level Producciones</title>
    <link rel="icon" sizes="32x32" href="../images/next.jpeg">
    <link rel="apple-touch-icon" href="../images/next.jpeg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <main class="login-view">
        <div class="container py-5">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                    <div class="card login-card shadow-lg border-0">
                        <div class="card-body p-4 p-md-5">
                            <div class="text-center mb-4">
                                <img src="../images/next.jpeg" alt="Next Level Producciones" class="admin-logo mb-3">
                                <h1 class="h4 fw-bold mb-1">Panel Administrativo</h1>
                                <p class="text-secondary mb-0">Acceso privado del administrador</p>
                            </div>

                            <form id="loginForm" novalidate>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Correo electronico</label>
                                    <input type="email" id="email" class="form-control" autocomplete="email" required>
                                    <div class="invalid-feedback">Ingresa un correo electronico valido.</div>
                                </div>

                                <div class="mb-4">
                                    <label for="password" class="form-label">Contrasena</label>
                                    <input type="password" id="password" class="form-control" autocomplete="current-password" minlength="6" required>
                                    <div class="invalid-feedback">Ingresa tu contrasena.</div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2" id="loginButton">
                                    <span class="spinner-border spinner-border-sm d-none" id="loginSpinner" aria-hidden="true"></span>
                                    <span id="loginButtonText">Iniciar sesion</span>
                                </button>

                                <div id="loginMessage" class="mt-3 small" role="alert" aria-live="polite"></div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
